{% extends "base.html" %}
{% block title %}Manual Check-In{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Manual Check-In</h4>
    <a href="{{ url_for('qr_attendance.scan_page') }}" class="btn btn-outline-primary btn-sm"><i class="bi bi-qr-code me-1"></i> QR Scan</a>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-medium">Member ID</label>
                <input type="text" name="member_id" class="form-control" placeholder="CH-2026-XXXX" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium">Service Type</label>
                <select name="service_type" class="form-select">
                    {% for s in services %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Check In</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
