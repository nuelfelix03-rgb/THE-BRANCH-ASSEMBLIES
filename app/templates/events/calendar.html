{% extends "base.html" %}
{% block title %}Event Calendar - THE BRANCH ASSEMBLY{% endblock %}
{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-calendar3"></i> Event Calendar</h4>
    <div>
        <a href="{{ url_for('events.list_events') }}" class="btn btn-outline-secondary btn-sm me-2">
            <i class="bi bi-list"></i> List View
        </a>
        <a href="{{ url_for('events.add_event') }}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg"></i> Add Event
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div id="calendar"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,listWeek'
        },
        events: '{{ url_for("events.api_events") }}',
        eventClick: function(info) {
            window.location.href = '{{ url_for("events.view_event", id=0) }}'.replace('0', info.event.id);
        }
    });
    calendar.render();
});
</script>
{% endblock %}
